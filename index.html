<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca Comunitária</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#f1f3f6;color:#1f2933;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .bar{background:#1d3557;color:#fff}
  .bar .in{max-width:1040px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .brand{font-size:1.15rem;font-weight:700;padding:14px 0}
  .bar nav{display:flex;flex:1}
  .bar nav button{background:none;border:0;color:#cfd9e6;padding:16px 16px;font:inherit;cursor:pointer;border-bottom:3px solid transparent}
  .bar nav button:hover{color:#fff}
  .bar nav button.on{color:#fff;border-color:#f4a261}
  .key{display:flex;gap:6px;align-items:center;padding:8px 0}
  .key input{width:200px;background:#2a4a75;border:1px solid #3d5f8f;color:#fff}
  .key input::placeholder{color:#a9bad0}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
  .panel{background:#fff;border:1px solid #dde2e8;border-radius:6px;padding:18px;margin-bottom:20px}
  h2{font-size:1.05rem;margin:0 0 14px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .head h2{margin:0}
  input,select{font:inherit;padding:8px 10px;border:1px solid #c5ccd5;border-radius:4px;background:#fff;color:#1f2933;min-width:0}
  input:focus,select:focus,button:focus-visible{outline:2px solid #3b6ea8;outline-offset:1px}
  button.btn{font:inherit;background:#1d3557;color:#fff;border:0;border-radius:4px;padding:8px 16px;cursor:pointer}
  button.btn:hover{background:#142843}
  button.btn.sec{background:#fff;color:#1d3557;border:1px solid #1d3557}
  button.btn.sec:hover{background:#eef2f7}
  button.btn.red{background:#fff;color:#b42318;border:1px solid #d9a5a0}
  button.btn.sm{padding:4px 10px;font-size:.85rem}
  button:disabled{opacity:.45;cursor:default}
  form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:#52606d;flex:1 1 150px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.8rem;color:#52606d;font-weight:600;padding:8px 10px;border-bottom:2px solid #dde2e8}
  td{padding:10px;border-bottom:1px solid #eceff3;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.act{text-align:right;white-space:nowrap}
  .tbl{overflow-x:auto}
  .badge{padding:2px 9px;border-radius:3px;font-size:.78rem;font-weight:600}
  .ATIVO{background:#e1ecf8;color:#1d4f91}.DEVOLVIDO{background:#dff3e4;color:#1e6b34}.ATRASADO{background:#fbe3e0;color:#b42318}
  .empty{padding:24px;text-align:center;color:#6b7785}
  .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;color:#52606d;font-size:.9rem}
  #conn{font-size:.85rem;color:#52606d;margin:0 0 14px}
  #toast{position:fixed;right:20px;bottom:20px;padding:12px 18px;border-radius:4px;background:#1f2933;color:#fff;display:none;max-width:90vw;z-index:9}
  #toast.err{background:#b42318}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <div class="brand">Biblioteca Comunitária</div>
  <nav id="tabs">
    <button data-tab="livros" class="on">Livros</button>
    <button data-tab="emprestimos">Empréstimos</button>
    <button data-tab="cadastros">Cadastros</button>
  </nav>
  <div class="key">
    <input id="apikey" type="password" placeholder="Chave de API" autocomplete="off" aria-label="Chave de API" maxlength="200">
    <button class="btn sec sm" id="genkey" type="button" style="background:#fff">Gerar chave</button>
  </div>
</div></div>

<div class="wrap">
  <p id="conn">Conectando à API… na primeira vez pode levar cerca de 1 minuto.</p>

  <section id="tab-livros">
    <div class="panel">
      <h2>Novo livro</h2>
      <form id="f-livro" novalidate>
        <label>Título<input name="titulo" required maxlength="150"></label>
        <label>ISBN (10 ou 13 números)<input name="isbn" required maxlength="13" inputmode="numeric" data-filtro="num"></label>
        <label>Ano<input name="ano" required maxlength="4" inputmode="numeric" data-filtro="num"></label>
        <label>Categoria<select name="categoria" required></select></label>
        <label>Autor<select name="autor" required></select></label>
        <button class="btn" type="submit">Salvar</button>
      </form>
    </div>
    <div class="panel">
      <div class="head"><h2>Acervo</h2></div>
      <div class="tbl"><table>
        <thead><tr><th>Título</th><th>Autor</th><th>Categoria</th><th>Ano</th><th>ISBN</th><th></th></tr></thead>
        <tbody id="l-livros"></tbody></table></div>
      <div class="pager"><button class="btn sec sm" id="prev" type="button">Anterior</button>
        <span id="pageinfo"></span><button class="btn sec sm" id="next" type="button">Próxima</button></div>
    </div>
  </section>

  <section id="tab-emprestimos" hidden>
    <div class="panel">
      <h2>Novo empréstimo</h2>
      <form id="f-emp" novalidate>
        <label>Usuário<select name="usuario" required></select></label>
        <label>Livro<select name="livro" required></select></label>
        <label>Devolução prevista<input name="data" type="date" required></label>
        <button class="btn" type="submit">Registrar</button>
      </form>
    </div>
    <div class="panel">
      <div class="head"><h2>Empréstimos</h2></div>
      <div class="tbl"><table>
        <thead><tr><th>Livro</th><th>Usuário</th><th>Prevista</th><th>Status</th><th></th></tr></thead>
        <tbody id="l-emp"></tbody></table></div>
    </div>
  </section>

  <section id="tab-cadastros" hidden>
    <div class="panel"><h2>Nova categoria</h2>
      <form id="f-cat" novalidate><label>Nome<input name="nome" required maxlength="60" data-filtro="nome"></label><button class="btn" type="submit">Salvar</button></form></div>
    <div class="panel"><h2>Novo autor</h2>
      <form id="f-aut" novalidate><label>Nome<input name="nome" required maxlength="100" data-filtro="nome"></label>
        <label>Nacionalidade<input name="nacionalidade" required maxlength="60" data-filtro="nome"></label><button class="btn" type="submit">Salvar</button></form></div>
    <div class="panel"><h2>Novo usuário</h2>
      <form id="f-usu" novalidate>
        <label>Nome<input name="nome" required maxlength="100" data-filtro="nome"></label>
        <label>E-mail<input name="email" type="email" required maxlength="120"></label>
        <label>Telefone (DDD + número)<input name="telefone" required maxlength="11" inputmode="numeric" data-filtro="num"></label>
        <label>Endereço<input name="endereco" required maxlength="150"></label>
        <label>Nascimento<input name="nasc" type="date" required></label>
        <button class="btn" type="submit">Salvar</button></form></div>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
const API = "https://biblioteca-api-0ikp.onrender.com";
const $ = (s, r = document) => r.querySelector(s);
let page = 0, lastPage = 0;

function toast(msg, erro = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = erro ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 4500);
}
const itens = d => d && d._embedded ? Object.values(d._embedded)[0] : [];
const key = () => $("#apikey").value.trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

async function api(path, { method = "GET", body, headers = {} } = {}) {
  const h = { Accept: "application/json", ...headers };
  if (body !== undefined) h["Content-Type"] = "application/json";
  if (method !== "GET" && key()) h["X-API-Key"] = key();
  const res = await fetch(API + path, { method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined });
  const texto = await res.text();
  const dados = texto ? JSON.parse(texto) : null;
  if (!res.ok) {
    let msg = dados && (dados.mensagem || dados.erro) || "Erro " + res.status;
    if (dados && dados.campos) msg += ": " + Object.values(dados.campos).join(", ");
    if (res.status === 401) msg = "Informe uma chave de API válida (botão “Gerar chave”).";
    if (res.status === 403) msg = "Esta ação exige uma chave de administrador.";
    if (res.status === 429) msg = "Muitas requisições. Aguarde " + (res.headers.get("Retry-After") || "alguns") + " segundos.";
    throw new Error(msg);
  }
  return dados;
}
const linhaVazia = (n, t) => `<tr><td colspan="${n}" class="empty">${t}</td></tr>`;
const opcoes = (arr, rotulo) => arr.length
  ? arr.map(o => `<option value="${o.id}">${esc(rotulo(o))}</option>`).join("")
  : `<option value="">Cadastre primeiro</option>`;

/* filtros de digitação: só números / só letras */
document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.filtro;
  if (f === "num") e.target.value = e.target.value.replace(/\D/g, "");
  if (f === "nome") e.target.value = e.target.value.replace(/[^\p{L}\s'.-]/gu, "");
});

/* limites de data */
const hoje = new Date().toISOString().slice(0, 10);
$("#f-emp [name=data]").min = hoje;
$("#f-usu [name=nasc]").max = hoje;
$("#f-usu [name=nasc]").min = "1900-01-01";

/* validação antes de enviar */
const anoAtual = new Date().getFullYear();
const validadores = {
  "#f-livro": f => {
    if (f.titulo.length < 2) return "Título: mínimo 2 caracteres.";
    if (!/^(\d{10}|\d{13})$/.test(f.isbn)) return "ISBN: informe 10 ou 13 números.";
    const a = Number(f.ano);
    if (!/^\d{4}$/.test(f.ano) || a < 1000 || a > anoAtual + 1) return "Ano: informe 4 números entre 1000 e " + (anoAtual + 1) + ".";
    if (!f.categoria || !f.autor) return "Cadastre uma categoria e um autor primeiro.";
  },
  "#f-cat": f => { if (f.nome.length < 2) return "Nome: mínimo 2 letras."; },
  "#f-aut": f => {
    if (f.nome.length < 3) return "Nome: mínimo 3 letras.";
    if (f.nacionalidade.length < 2) return "Nacionalidade: mínimo 2 letras.";
  },
  "#f-usu": f => {
    if (f.nome.length < 3) return "Nome: mínimo 3 letras.";
    if (!/^\S+@\S+\.\S+$/.test(f.email)) return "E-mail inválido.";
    if (!/^\d{10,11}$/.test(f.telefone)) return "Telefone: informe DDD + número (10 ou 11 números).";
    if (f.endereco.length < 5) return "Endereço: mínimo 5 caracteres.";
    if (!f.nasc || f.nasc > hoje) return "Nascimento não pode ser no futuro.";
  },
  "#f-emp": f => {
    if (!f.usuario || !f.livro) return "Cadastre um usuário e um livro primeiro.";
    if (!f.data || f.data < hoje) return "A devolução prevista não pode ser no passado.";
  }
};

/* chave de API */
$("#apikey").value = localStorage.getItem("apikey") || "";
$("#apikey").addEventListener("change", e => localStorage.setItem("apikey", e.target.value.trim()));
$("#genkey").addEventListener("click", async () => {
  const dono = (prompt("Nome do dono da chave (3 a 100 caracteres):") || "").trim();
  if (!dono) return;
  if (dono.length < 3 || dono.length > 100) { toast("O nome deve ter de 3 a 100 caracteres.", true); return; }
  try {
    const k = await api("/api-keys", { method: "POST", body: { dono } });
    $("#apikey").value = k.chave; localStorage.setItem("apikey", k.chave);
    toast("Chave gerada e preenchida.");
  } catch (e) { toast(e.message, true); }
});

/* abas */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["livros", "emprestimos", "cadastros"].forEach(n => $("#tab-" + n).hidden = n !== b.dataset.tab);
  if (b.dataset.tab === "emprestimos") carregarEmprestimos();
});

/* dados */
async function carregarSelects() {
  const [cats, auts, usus, livs] = await Promise.all([
    api("/categorias?size=200"), api("/autores?size=200"), api("/usuarios?size=200"), api("/livros?size=200")]);
  $("#f-livro [name=categoria]").innerHTML = opcoes(itens(cats), c => c.nome);
  $("#f-livro [name=autor]").innerHTML = opcoes(itens(auts), a => a.nome);
  $("#f-emp [name=usuario]").innerHTML = opcoes(itens(usus), u => u.nome);
  $("#f-emp [name=livro]").innerHTML = opcoes(itens(livs), l => l.titulo);
}
async function carregarLivros() {
  const d = await api(`/livros?page=${page}&size=8&sort=titulo,asc`);
  const lista = itens(d);
  lastPage = d.page ? d.page.totalPages - 1 : 0;
  $("#l-livros").innerHTML = lista.length ? lista.map(l => `<tr>
      <td><strong>${esc(l.titulo)}</strong></td>
      <td>${esc((l.autores || []).map(a => a.nome).join(", "))}</td>
      <td>${esc(l.categoria && l.categoria.nome)}</td><td>${esc(l.anoPublicacao)}</td><td>${esc(l.isbn)}</td>
      <td class="act"><button class="btn red sm" data-del-livro="${l.id}">Excluir</button></td></tr>`).join("")
    : linhaVazia(6, "Nenhum livro cadastrado. Crie uma categoria e um autor em Cadastros e depois salve o primeiro livro.");
  $("#pageinfo").textContent = "Página " + (page + 1) + " de " + Math.max(lastPage + 1, 1);
  $("#prev").disabled = page <= 0; $("#next").disabled = page >= lastPage;
}
async function carregarEmprestimos() {
  try {
    const lista = itens(await api("/emprestimos?size=50&sort=id,desc"));
    $("#l-emp").innerHTML = lista.length ? lista.map(e => `<tr>
        <td><strong>${esc(e.livro && e.livro.titulo || "Livro #" + (e.livro && e.livro.id))}</strong></td>
        <td>${esc(e.usuario && e.usuario.nome || "Usuário #" + (e.usuario && e.usuario.id))}</td>
        <td>${esc(e.dataPrevista)}</td><td><span class="badge ${esc(e.status)}">${esc(e.status)}</span></td>
        <td class="act">${e.status !== "DEVOLVIDO" ? `<button class="btn sec sm" data-dev="${e.id}">Registrar devolução</button>` : ""}</td></tr>`).join("")
      : linhaVazia(5, "Nenhum empréstimo registrado ainda.");
  } catch (e) { toast(e.message, true); }
}
async function tudo() {
  try { await carregarSelects(); await carregarLivros(); $("#conn").textContent = "Conectado à API."; }
  catch (e) { $("#conn").textContent = "Não foi possível conectar à API. Recarregue a página em alguns segundos."; toast(e.message, true); }
}

/* ações */
$("#prev").onclick = () => { page--; carregarLivros(); };
$("#next").onclick = () => { page++; carregarLivros(); };
document.addEventListener("click", async e => {
  const del = e.target.dataset.delLivro, dev = e.target.dataset.dev;
  try {
    if (del && confirm("Excluir este livro? (exige chave de administrador)")) {
      await api("/livros/" + del, { method: "DELETE" }); toast("Livro excluído."); tudo();
    }
    if (dev) { await api("/emprestimos/" + dev + "/devolucao", { method: "PATCH" }); toast("Devolução registrada."); carregarEmprestimos(); }
  } catch (err) { toast(err.message, true); }
});
function enviar(sel, fn, ok) {
  $(sel).addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = Object.fromEntries([...new FormData(ev.target)].map(([k, v]) => [k, String(v).trim()]));
    const campoVazio = [...ev.target.elements].find(x => x.required && !String(x.value).trim());
    if (campoVazio) { toast("Preencha todos os campos.", true); campoVazio.focus(); return; }
    const erro = validadores[sel] && validadores[sel](f);
    if (erro) { toast(erro, true); return; }
    try { await fn(f); ev.target.reset(); toast(ok); await tudo(); if (!$("#tab-emprestimos").hidden) carregarEmprestimos(); }
    catch (err) { toast(err.message, true); }
  });
}
enviar("#f-livro", f => api("/livros", { method: "POST", body: {
  titulo: f.titulo, isbn: f.isbn, anoPublicacao: Number(f.ano),
  categoria: { id: Number(f.categoria) }, autores: [{ id: Number(f.autor) }] } }), "Livro salvo.");
enviar("#f-cat", f => api("/categorias", { method: "POST", body: { nome: f.nome } }), "Categoria salva.");
enviar("#f-aut", f => api("/autores", { method: "POST", body: { nome: f.nome, nacionalidade: f.nacionalidade } }), "Autor salvo.");
enviar("#f-usu", f => api("/usuarios", { method: "POST", body: { nome: f.nome, email: f.email,
  perfil: { telefone: f.telefone, endereco: f.endereco, dataNascimento: f.nasc } } }), "Usuário salvo.");
enviar("#f-emp", f => api("/emprestimos", { method: "POST",
  headers: { "X-Idempotency-Key": crypto.randomUUID() },
  body: { usuario: { id: Number(f.usuario) }, livro: { id: Number(f.livro) }, dataPrevista: f.data } }), "Empréstimo registrado.");

tudo();
</script>
</body>
</html>
